name: Runtime candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/patched-helpers-20261026]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/robertdwhite/argocd-security-runtime:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime tools
        env:
          IMAGE: ghcr.io/robertdwhite/argocd-security-runtime:sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint argocd "$IMAGE" version --client -o json
          docker run --rm --entrypoint helm "$IMAGE" version
          docker run --rm --entrypoint git-lfs "$IMAGE" version
          docker run --rm --entrypoint kustomize "$IMAGE" version
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            mkdir -p /tmp/ksops-check /tmp/kustomize-check
            ksops install /tmp/ksops-check
            test -x /tmp/ksops-check/ksops
            printf "resources: [config.yaml]\n" > /tmp/kustomize-check/kustomization.yaml
            printf "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: runtime-check\ndata:\n  result: passed\n" > /tmp/kustomize-check/config.yaml
            kustomize build /tmp/kustomize-check | grep "result: passed"
          '
